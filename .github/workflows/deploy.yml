name: Deploy to GitHub Pages

# Every push to main builds and publishes the site.
#
# Preview vs. live is one switch: the repository variable LIVE_DOMAIN
# (Settings → Secrets and variables → Actions → Variables).
#   • Not set:   preview at https://itsjoeyboots.github.io/desert-social/,
#                hidden from search engines.
#   • Set to desertsocialaz.com: the live site at the domain's root, indexed,
#                with a CNAME file so GitHub Pages serves the custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          LIVE_DOMAIN: ${{ vars.LIVE_DOMAIN }}
        run: |
          if [ -n "$LIVE_DOMAIN" ]; then
            export SITE_URL="https://$LIVE_DOMAIN" BASE_PATH="/"
          else
            export SITE_URL="https://itsjoeyboots.github.io" BASE_PATH="/desert-social" PUBLIC_NOINDEX=1
          fi
          npm run build
          if [ -n "$LIVE_DOMAIN" ]; then echo "$LIVE_DOMAIN" > dist/CNAME; fi
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
